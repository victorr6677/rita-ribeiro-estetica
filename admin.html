<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Painel | Rita Ribeiro Estética</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--cream:#FBF8F3;--champ:#EEE9DE;--brown:#35241D;--soft:#6B574B;--brand:#6A5141;--gold:#B39358;--line:rgba(53,36,29,.18);--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--brown);font:400 1rem/1.5 var(--sans);-webkit-text-size-adjust:100%;padding-bottom:calc(6.5rem + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:.7rem;padding:calc(.8rem + env(safe-area-inset-top,0px)) 1.1rem .8rem;border-bottom:1px solid var(--line);background:var(--cream);position:sticky;top:0;z-index:5}
header img{width:40px;height:40px;border-radius:50%}
header b{font:600 1.15rem Georgia,serif;margin-right:auto}
header a,.lk{color:var(--brand);font:500 .95rem var(--sans);background:none;border:0;padding:.5rem;min-height:44px;text-decoration:underline;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:1.1rem}
h1{font:500 1.7rem Georgia,serif;margin:.4rem 0 1rem}
p.s{color:var(--soft);margin:0 0 1rem}
label{display:block;font-weight:500;margin:0 0 1rem}
label small{display:block;font-weight:400;color:var(--soft);font-size:.85rem;margin-top:.2rem}
input:not([type=checkbox]),textarea{display:block;width:100%;margin-top:.3rem;padding:.75rem .85rem;font:400 1rem var(--sans);color:var(--brown);background:#fff;border:1px solid var(--line);border-radius:12px;min-height:48px}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
details{background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 0 .8rem}
summary{list-style:none;cursor:pointer;padding:1rem 1.1rem;font:600 1.05rem var(--sans);min-height:52px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.5rem;color:var(--brand)}
details[open] summary::after{content:"\2212"}
.in{padding:0 1.1rem 1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.6rem 1.4rem;border-radius:999px;border:1px solid var(--brown);background:var(--brown);color:var(--cream);font:500 1rem var(--sans);cursor:pointer}
.btn.o{background:transparent;color:var(--brown)}
.btn:disabled{opacity:.55}
.item{border:1px solid var(--line);border-radius:12px;padding:.9rem;margin:0 0 .8rem;background:var(--cream)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin:0 0 1rem}
.ph span{flex:1 0 100%;font-weight:500}
.ph img{width:96px;height:120px;object-fit:cover;border-radius:10px}
.ph em{color:var(--soft)}
.chk{display:flex;align-items:center;gap:.7rem;min-height:48px}
.chk input{width:24px;height:24px;margin:0}
#bar{position:fixed;left:0;right:0;bottom:0;padding:.8rem 1.1rem calc(.8rem + env(safe-area-inset-bottom,0px));background:rgba(251,248,243,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:.9rem;z-index:6}
#bar .btn{flex:none}
#msg{font-size:.95rem;color:var(--soft)}
#msg.ok{color:#2F6B3A}#msg.er{color:#9B2C2C}
</style>
</head>
<body>
<header><img src="logo.png" alt="" onerror="this.hidden=true"><b>Painel da Rita</b><a href="index.html" target="_blank" rel="noopener">Ver site</a><button class="lk" id="out" hidden>Sair</button></header>
<main id="app"></main>
<div id="bar" hidden><button class="btn" id="save">Salvar e publicar</button><span id="msg" role="status"></span></div>
<script src="supabase-config.js"></script>
<script src="site-config.js"></script>
<script>
(()=>{
const S=window.SUPABASE||{},B=window.SITE_CONFIG||{},$=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ses=null,D={};try{ses=JSON.parse(localStorage.getItem("rita_ses")||"null")}catch(e){}
const say=(t,c)=>{const m=$("#msg");m.textContent=t||"";m.className=c||""};
const J={"Content-Type":"application/json",apikey:S.key};

/* sessão */
const setSes=j=>{ses={t:j.access_token,r:j.refresh_token,e:Date.now()+(j.expires_in-60)*1000};try{localStorage.setItem("rita_ses",JSON.stringify(ses))}catch(e){}};
const logout=()=>{ses=null;try{localStorage.removeItem("rita_ses")}catch(e){}start()};
async function token(){
  if(ses&&Date.now()>ses.e){
    const r=await fetch(S.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:J,body:JSON.stringify({refresh_token:ses.r})});
    if(!r.ok){logout();throw new Error("Sessão expirada. Entre de novo.")}
    setSes(await r.json());
  }
  return ses.t;
}

/* dados */
const norm=()=>{
  const d=String(D.whatsapp||"").replace(/\D/g,"");D.whatsapp=(d.length===10||d.length===11)?"55"+d:d;
  D.instagram=String(D.instagram||"").trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/[\/?#].*$/,"");
  D.procedimentos=(D.procedimentos||[]).filter(p=>p.nome&&p.nome.trim());
  D.galeria=(D.galeria||[]).filter(g=>g.src);
  D.depoimentos=(D.depoimentos||[]).filter(t=>t.texto&&t.texto.trim());
};
async function load(){
  const r=await fetch(S.url+"/rest/v1/site_config?id=eq.1&select=data",{headers:{apikey:S.key}});
  if(!r.ok)throw new Error("Não consegui ler os dados do site.");
  const j=await r.json(),rem=(j[0]&&j[0].data)||{};
  D=Object.assign({whatsapp:"",mensagemWhatsapp:"",instagram:"",endereco:"",horario:"",fotoHero:"",procedimentos:[],galeria:[],depoimentos:[]},JSON.parse(JSON.stringify(B)),rem);
  D.profissional=Object.assign({confirmado:false,nome:"",cargo:"",formacao:"",experiencia:"",foto:""},D.profissional);
}
async function save(){
  norm();
  if(D.whatsapp&&!/^55\d{10,11}$/.test(D.whatsapp))throw new Error("Confira o WhatsApp: use DDD + número.");
  const t=await token();
  const r=await fetch(S.url+"/rest/v1/site_config?id=eq.1",{method:"PATCH",headers:{...J,Authorization:"Bearer "+t,Prefer:"return=representation"},body:JSON.stringify({data:D,updated_at:new Date().toISOString()})});
  if(!r.ok)throw new Error("Não foi possível salvar ("+r.status+").");
  const j=await r.json();if(!j.length)throw new Error("Nada foi salvo. Confira a configuração do Supabase.");
}
async function shrink(f){
  const im=await createImageBitmap(f),k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(ok,"image/jpeg",.85));
}
async function upload(f){
  const b=await shrink(f),n=Date.now().toString(36)+Math.random().toString(36).slice(2,6)+".jpg",t=await token();
  const r=await fetch(S.url+"/storage/v1/object/fotos/"+n,{method:"POST",headers:{apikey:S.key,Authorization:"Bearer "+t,"Content-Type":"image/jpeg"},body:b});
  if(!r.ok)throw new Error("Falha ao enviar a foto.");
  return S.url+"/storage/v1/object/public/fotos/"+n;
}

/* telas */
const get=p=>p.split(".").reduce((o,k)=>o==null?o:o[k],D);
const set=(p,v)=>{const a=p.split("."),l=a.pop();a.reduce((o,k)=>o[k],D)[l]=v};
const f=(lab,p,o={})=>`<label>${lab}${o.ta?`<textarea data-p="${p}" rows="${o.ta}">${esc(get(p))}</textarea>`:`<input data-p="${p}" value="${esc(get(p))}" ${o.a||""}>`}${o.h?`<small>${o.h}</small>`:""}</label>`;
const photo=(lab,p)=>`<div class="ph"><span>${lab}</span>${get(p)?`<img src="${esc(get(p))}" alt="">`:"<em>Sem foto</em>"}<label class="btn o" style="margin:0">${get(p)?"Trocar foto":"Escolher foto"}<input type="file" accept="image/*" hidden data-up="${p}"></label>${get(p)?`<button class="lk" data-clr="${p}">Remover</button>`:""}</div>`;
const sec=(t,b,o)=>`<details${o?" open":""}><summary>${t}</summary><div class="in">${b}</div></details>`;
function editor(){
  const op=[...document.querySelectorAll("details")].map(d=>d.open),y=scrollY;
  const P=D.procedimentos.map((p,i)=>`<div class="item">${f("Nome","procedimentos."+i+".nome")}${f("Descrição","procedimentos."+i+".descricao",{ta:3})}<button class="lk" data-del="procedimentos.${i}">Remover</button></div>`).join("");
  const G=D.galeria.map((g,i)=>`<div class="item">${photo("Foto "+(i+1),"galeria."+i+".src")}${f("Descrição da foto","galeria."+i+".alt",{h:"Ex.: Sala de atendimento"})}<button class="lk" data-del="galeria.${i}">Remover foto</button></div>`).join("");
  const T=D.depoimentos.map((t,i)=>`<div class="item">${f("Depoimento","depoimentos."+i+".texto",{ta:4})}${f("Nome de quem escreveu","depoimentos."+i+".autor")}<label class="chk"><input type="checkbox" data-p="depoimentos.${i}.autorizado"${t.autorizado?" checked":""}> Tenho autorização para publicar</label><button class="lk" data-del="depoimentos.${i}">Remover</button></div>`).join("");
  $("#app").innerHTML=`<h1>Editar o site</h1><p class="s">Altere e toque em <b>Salvar e publicar</b>. O site atualiza na hora.</p>`+
  sec("Contato",f("WhatsApp","whatsapp",{a:'type="tel" inputmode="tel"',h:"Com DDD. Ex.: (35) 99999-9999"})+f("Mensagem inicial do WhatsApp","mensagemWhatsapp",{ta:3})+f("Instagram","instagram",{h:"Só o usuário, sem @ e sem link"})+f("Endereço","endereco",{ta:2})+f("Horário de funcionamento","horario",{ta:2}),1)+
  sec("Foto principal",photo("Foto do espaço (aparece no início do site)","fotoHero"))+
  sec("Procedimentos",`<p class="s">Só os confirmados pela Rita.</p>${P}<button class="btn o" data-add="procedimentos">Adicionar procedimento</button>`)+
  sec("Galeria de fotos",`${G}<label class="btn o">Adicionar foto<input type="file" accept="image/*" hidden data-up="galeria+"></label>`)+
  sec("Sobre a profissional",`<label class="chk"><input type="checkbox" data-p="profissional.confirmado"${D.profissional.confirmado?" checked":""}> Dados confirmados (mostrar no site)</label>`+f("Nome","profissional.nome")+f("Cargo e registro","profissional.cargo")+f("Formação","profissional.formacao",{ta:3})+f("Experiência","profissional.experiencia",{ta:3})+photo("Foto da profissional","profissional.foto"))+
  sec("Depoimentos",`<p class="s">Somente depoimentos reais e autorizados.</p>${T}<button class="btn o" data-add="depoimentos">Adicionar depoimento</button>`);
  if(op.length)document.querySelectorAll("details").forEach((d,i)=>{d.open=!!op[i]});
  scrollTo(0,y);$("#bar").hidden=false;$("#out").hidden=false;
}
function loginView(){
  $("#bar").hidden=true;$("#out").hidden=true;
  $("#app").innerHTML=S.url&&S.key?`<h1>Entrar</h1><p class="s">Acesso restrito à administração do site.</p><label>E-mail<input id="em" type="email" autocomplete="username" autocapitalize="none"></label><label>Senha<input id="pw" type="password" autocomplete="current-password"></label><button class="btn" id="go">Entrar</button><p id="le" class="s" style="color:#9B2C2C"></p>`:`<h1>Painel ainda não conectado</h1><p class="s">Preencha o arquivo supabase-config.js com os dados do Supabase.</p>`;
  const go=$("#go");if(go)go.onclick=async()=>{
    go.disabled=true;$("#le").textContent="";
    try{const r=await fetch(S.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:J,body:JSON.stringify({email:$("#em").value.trim(),password:$("#pw").value})});
      if(!r.ok)throw new Error("E-mail ou senha incorretos.");setSes(await r.json());start()}
    catch(e){$("#le").textContent=e.message;go.disabled=false}
  };
}
async function start(){
  if(!ses||!S.url)return loginView();
  $("#app").innerHTML='<p class="s">Carregando…</p>';
  try{await token();await load();editor()}catch(e){loginView();const le=$("#le");if(le)le.textContent=e.message}
}

/* eventos */
document.addEventListener("input",e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p)return;set(p,e.target.type==="checkbox"?e.target.checked:e.target.value);say("")});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-add],[data-del],[data-clr]");if(!t)return;
  if(t.dataset.add){D[t.dataset.add].push(t.dataset.add==="depoimentos"?{texto:"",autor:"",autorizado:false}:{nome:"",descricao:""})}
  else if(t.dataset.del){const a=t.dataset.del.split(".");D[a[0]].splice(+a[1],1)}
  else set(t.dataset.clr,"");
  editor();
});
document.addEventListener("change",async e=>{
  const p=e.target.dataset&&e.target.dataset.up,file=e.target.files&&e.target.files[0];if(!p||!file)return;
  say("Enviando foto…");
  try{const u=await upload(file);if(p==="galeria+")D.galeria.push({src:u,alt:""});else set(p,u);editor();say("Foto enviada. Toque em Salvar e publicar.","ok")}
  catch(x){say(x.message,"er")}
});
$("#save").onclick=async()=>{const b=$("#save");b.disabled=true;say("Salvando…");
  try{await save();editor();say("Publicado! O site já está atualizado.","ok")}catch(e){say(e.message,"er")}b.disabled=false};
$("#out").onclick=logout;
start();
})();
</script>
</body>
</html>
